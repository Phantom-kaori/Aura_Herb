<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f0e8">
    <title>A quiet moment — breathing exercise</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #463936;
        --muted: #84736c;
        --rose: #d99a9a;
        --rose-light: #f0c6bd;
        --sage: #a9b69a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        color: var(--ink);
        background: radial-gradient(ellipse at 50% 34%, #fffaf1 0%, #f5f0e8 68%, #eee8df 100%);
        font-family: Georgia, 'Times New Roman', serif;
      }

      main { width: min(100%, 560px); text-align: center; }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--muted);
        font: 600 11px/1.4 system-ui, sans-serif;
        letter-spacing: .22em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(30px, 7vw, 43px); font-weight: 400; }
      .subtitle { margin: 9px 0 0; color: var(--muted); font: 14px/1.6 system-ui, sans-serif; }

      .flower-wrap {
        width: min(78vw, 360px);
        aspect-ratio: 1;
        margin: 18px auto 4px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .flower-wrap::before, .flower-wrap::after {
        content: '';
        position: absolute;
        inset: 9%;
        border: 1px solid rgb(169 182 154 / 35%);
        border-radius: 50%;
      }
      .flower-wrap::after { inset: 17%; border-color: rgb(217 154 154 / 25%); }
      .rose {
        display: block;
        width: 100%;
        overflow: visible;
        filter: drop-shadow(0 13px 18px rgb(112 78 67 / 11%));
      }
      .petals {
        fill: var(--rose);
        transform-box: view-box;
        transform-origin: 500px 500px;
        transition: transform 4s ease-in-out, fill 1s ease;
      }
      .rose.is-inhaling .petals { transform: scale(1.08); fill: var(--rose-light); }
      .rose.is-exhaling .petals { transform: scale(.94); }
      .title {
        fill: var(--ink);
        font: 500 56px Georgia, 'Times New Roman', serif;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .phase { min-height: 32px; margin: 0; font: 600 18px/1.5 system-ui, sans-serif; }
      .count { min-height: 22px; margin: 2px 0 0; color: var(--muted); font: 13px/1.5 system-ui, sans-serif; }
      .controls { margin-top: 22px; display: flex; justify-content: center; gap: 10px; }
      button {
        min-height: 58px;
        padding: 0 26px;
        border: 1px solid #c96f7c;
        border-radius: 999px;
        color: #fff;
        background: #d97886;
        box-shadow: 0 7px 18px rgb(169 81 96 / 22%);
        font: 700 16px system-ui, sans-serif;
        cursor: pointer;
        transition: background .2s, transform .2s, box-shadow .2s;
      }
      button:hover { background: #c96575; transform: translateY(-2px); box-shadow: 0 10px 22px rgb(169 81 96 / 30%); }
      button:focus-visible { outline: 3px solid #9b766a; outline-offset: 3px; }
      .go.back {
        position: absolute;
        top: 24px;
        left: 24px;
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 999px;
        color: #fff;
        background: #bd596b;
        font: 700 15px system-ui, sans-serif;
        text-decoration: none;
        box-shadow: 0 5px 14px rgb(140 57 72 / 22%);
      }
      .go.back:hover { background: #a94759; }
      @media (max-width: 520px) {
        .go.back { top: 14px; left: 14px; min-height: 42px; padding: 0 15px; font-size: 13px; }
        .controls { flex-wrap: wrap; }
      }
      .note { margin: 16px 0 0; color: var(--muted); font: 12px/1.5 system-ui, sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: .01ms !important; }
      }
    </style>
</head>
<body>
    <a class="go back" href="index.html" aria-label="Back to home">← Back to home</a>
  <main>
    <p class="eyebrow">A little space for you</p>
    <h1>A quiet moment</h1>
    <p class="subtitle">Follow the flower. Let your breath find its own gentle pace.</p>

    <div class="flower-wrap">
      <svg class="rose" viewBox="0 0 1000 1000" role="img" aria-label="Flower expands as you breathe in and softens as you breathe out">
        <g class="petals">
          <circle cx="500" cy="275" r="225" />
          <circle cx="694.86" cy="387.5" r="225" />
          <circle cx="694.86" cy="612.5" r="225" />
          <circle cx="500" cy="725" r="225" />
          <circle cx="305.14" cy="612.5" r="225" />
          <circle cx="305.14" cy="387.5" r="225" />
        </g>
        <text class="title" x="500" y="520">Breathe</text>
      </svg>
    </div>
    <p class="phase" id="phase" aria-live="polite">Ready when you are</p>
    <p class="count" id="count" aria-hidden="true">In · Hold · Out · Hold</p>
    <div class="controls">
      <button id="start" type="button">Begin practice</button>
      <button id="sound" type="button" aria-pressed="false">Sound off</button>
    </div>
    <audio controls aria-label="Breathing exercise audio">
      <source src="..." type="audio/mpeg">
    </audio>
    <p class="note">In for 4 · hold for 2 · out for 6 · rest for 2</p>
  </main>
  <script>
    (() => {
      const flower = document.querySelector('.rose');
      const title = flower && flower.querySelector('.title');
      const phaseLabel = document.querySelector('#phase');
      const countLabel = document.querySelector('#count');
      const startButton = document.querySelector('#start');
      const soundButton = document.querySelector('#sound');
      if (!flower || !title || !phaseLabel || !countLabel) return;

      const phases = [
        { label: 'Breathe in', seconds: 4, className: 'is-inhaling' },
        { label: 'Hold gently', seconds: 2, className: 'is-inhaling' },
        { label: 'Breathe out', seconds: 6, className: 'is-exhaling' },
        { label: 'Rest', seconds: 2, className: '' }
      ];
      let phaseIndex = 0;
      let timer;
      let running = false;
      let soundOn = false;
      let audio;

      function chime() {
        if (!soundOn) return;
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === 'suspended') audio.resume();
          const oscillator = audio.createOscillator();
          const gain = audio.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = 528;
          gain.gain.setValueAtTime(0.0001, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.055, audio.currentTime + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.8);
          oscillator.connect(gain).connect(audio.destination);
          oscillator.start();
          oscillator.stop(audio.currentTime + 0.82);
        } catch (_) { /* Audio is optional; the visual guide still works. */ }
      }

      function runPhase() {
        if (!running) return;
        const phase = phases[phaseIndex];
        title.textContent = phase.label;
        phaseLabel.textContent = phase.label;
        flower.classList.remove('is-inhaling', 'is-exhaling');
        if (phase.className) flower.classList.add(phase.className);
        chime();
        let remaining = phase.seconds;
        countLabel.textContent = `${remaining} seconds`;
        clearInterval(timer);
        timer = window.setInterval(() => {
          remaining -= 1;
          countLabel.textContent = `${remaining} ${remaining === 1 ? 'second' : 'seconds'}`;
          if (remaining <= 0) {
            clearInterval(timer);
            phaseIndex = (phaseIndex + 1) % phases.length;
            runPhase();
          }
        }, 1000);
      }

      startButton.addEventListener('click', () => {
        running = !running;
        startButton.textContent = running ? 'Pause practice' : 'Resume practice';
        if (running) runPhase();
        else {
          clearInterval(timer);
          phaseLabel.textContent = 'Paused';
          countLabel.textContent = 'Take your time';
        }
      });

      soundButton.addEventListener('click', () => {
        soundOn = !soundOn;
        soundButton.textContent = soundOn ? 'Sound on' : 'Sound off';
        soundButton.setAttribute('aria-pressed', String(soundOn));
        if (soundOn) chime();
      });
    })();
  </script>
</body>
</html>
